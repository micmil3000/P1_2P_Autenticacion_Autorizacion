<section class="no-access">
    <div class="no-access__header">
        <div class="no-access__icon">
            <span>!</span>
        </div>

        <h1 class="no-access__title">Acceso denegado</h1>

        <p class="no-access__message">
            No tienes permisos para acceder a esta página.
        </p>
    </div>

    <button
        class="no-access__button"
        type="button"
        (click)="logout()"
    >
        Cerrar Sesión
    </button>
</section>
